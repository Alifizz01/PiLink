[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pilink"
version = "1.0.0"
description = "PiLink - a Raspberry Pi transfer appliance between a Windows PC (FTP/FTPS) and a USB flash drive, with verified copies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Muhamad Alif Izzuwan Bin Ibrahim" }]
dependencies = ["textual>=0.80", "pyyaml>=6"]

[project.optional-dependencies]
demo = ["pyftpdlib>=1.5"]
dev = ["pytest>=7", "pyftpdlib>=1.5"]

[project.scripts]
pilink = "pilink.cli:main"
pilink-ui = "pilink.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pilink = ["ui/*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
